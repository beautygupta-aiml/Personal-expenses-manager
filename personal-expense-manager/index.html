
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Personal Expense Manager</h1>
        <p>Track your daily expenses easily.</p>

        <div class="total-box">
            <h2>Total Expenses</h2>
            <h3 id="total">₹0</h3>
        </div>

        <form id="expense-form">
            <label for="title">Expense Name</label>
            <input type="text" id="title" placeholder="e.g. Food" required>

            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <label for="date">Date</label>
            <input type="date" id="date" required>

            <button type="submit">Add Expense</button>
        </form>
        
<h2>Spending by Category</h2>
<div id="category-summary"></div>

        <h2>Expense History</h2>
        
<input
    type="text"
    id="search-expense"
    placeholder="Search expense by title..."
>

<select id="filter-category">
    <option value="All">All Categories</option>
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Other">Other</option>
</select>

        <div id="expense-list">
            <p>No expenses added yet.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
